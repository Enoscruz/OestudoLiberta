<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura da plataforma OestudoLiberta — componentes</title>
  <desc id="description">Diagrama de componentes e integrações do frontend, backend, banco de dados e provedores externos, com ambientes local e de produção previstos.</desc>
  <!-- Diagramas exportados como SVG para permanecerem nítidos e revisáveis no Git. -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#830000"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#333333"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #000000; }
      .subtitle { font: 16px Arial, sans-serif; fill: #555555; }
      .lane-title { font: 700 15px Arial, sans-serif; letter-spacing: 1.2px; fill: #830000; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #111111; }
      .node-copy { font: 14px Arial, sans-serif; fill: #444444; }
      .small { font: 13px Arial, sans-serif; fill: #555555; }
      .micro { font: 12px Arial, sans-serif; fill: #555555; }
      .white { fill: #ffffff; }
      .lane { fill: #ffffff; stroke: #d7d7d7; stroke-width: 1.5; }
      .node { fill: #fafafa; stroke: #bdbdbd; stroke-width: 1.5; }
      .node-red { fill: #fff8f8; stroke: #bc0202; stroke-width: 2; }
      .node-dark { fill: #111111; stroke: #111111; stroke-width: 1.5; }
      .line { fill: none; stroke: #830000; stroke-width: 2.5; marker-end: url(#arrow); }
      .line-dark { fill: none; stroke: #333333; stroke-width: 2; marker-end: url(#arrow-dark); }
      .line-dashed { fill: none; stroke: #bc0202; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .label { font: 12px Arial, sans-serif; fill: #830000; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f5f5f5"/>
  <text x="48" y="58" class="title">OestudoLiberta | Arquitetura da plataforma</text>
  <text x="48" y="88" class="subtitle">Monólito modular com identidade delegada, domínio transacional e provedores especializados</text>

  <rect x="40" y="125" width="245" height="555" rx="8" class="lane"/>
  <rect x="305" y="125" width="365" height="555" rx="8" class="lane"/>
  <rect x="690" y="125" width="510" height="555" rx="8" class="lane"/>
  <rect x="1220" y="125" width="340" height="555" rx="8" class="lane"/>
  <text x="62" y="158" class="lane-title">PESSOAS E CLIENTE</text>
  <text x="327" y="158" class="lane-title">FRONTEND</text>
  <text x="712" y="158" class="lane-title">BACKEND · MONÓLITO MODULAR</text>
  <text x="1242" y="158" class="lane-title">DADOS E PROVEDORES</text>

  <path d="M163 278 V350" class="line-dark"/>
  <path d="M260 405 H330 V250 H355" class="line"/>
  <path d="M500 318 V398" class="line-dark"/>
  <path d="M645 246 H735" class="line"/>
  <path d="M955 275 V304" class="line"/>
  <path d="M955 393 V418" class="line"/>
  <path d="M955 500 V535" class="line"/>
  <path d="M1165 458 H1190 V250 H1260" class="line"/>
  <path d="M1165 550 H1210 V470 H1260" class="line"/>
  <path d="M1165 586 H1260" class="line"/>
  <path d="M1165 625 H1210 V652 H1260" class="line"/>
  <path d="M645 448 H680 V700 H1538 V470 H1520" class="line-dark"/>
  <path d="M1520 652 H1540 V715 H700 V232 H735" class="line-dashed"/>

  <text x="272" y="390" class="label">HTTPS</text>
  <text x="668" y="232" class="label">ID Token</text>
  <text x="1193" y="238" class="label">SQL</text>
  <text x="1174" y="570" class="label">Stream API</text>
  <text x="1173" y="645" class="label">Checkout</text>
  <text x="830" y="708" class="label">webhook payment.updated</text>
  <text x="810" y="694" class="label">Firebase Auth SDK</text>

  <rect x="65" y="190" width="195" height="88" rx="6" class="node-dark"/>
  <text x="84" y="222" class="node-title white">Aluno / Admin</text>
  <text x="84" y="248" class="node-copy white">desktop · tablet · mobile</text>
  <rect x="65" y="350" width="195" height="110" rx="6" class="node"/>
  <text x="84" y="385" class="node-title">Navegador</text>
  <text x="84" y="411" class="node-copy">UI e chamadas HTTP</text>
  <text x="84" y="435" class="node-copy">nenhuma regra confiável</text>

  <rect x="355" y="190" width="290" height="128" rx="6" class="node-red"/>
  <text x="378" y="225" class="node-title">Next.js 16 · React 19</text>
  <text x="378" y="252" class="node-copy">catálogo · checkout · player</text>
  <text x="378" y="276" class="node-copy">dashboard · administração</text>
  <text x="378" y="300" class="node-copy">Next.js standalone no container</text>
  <rect x="355" y="398" width="290" height="100" rx="6" class="node"/>
  <text x="378" y="433" class="node-title">Firebase Web SDK</text>
  <text x="378" y="460" class="node-copy">cadastro · login · ID Token</text>
  <text x="378" y="482" class="node-copy">senha nunca passa pela API</text>

  <rect x="735" y="190" width="430" height="85" rx="6" class="node-red"/>
  <text x="758" y="224" class="node-title">API FastAPI · /api/v1</text>
  <text x="758" y="250" class="node-copy">rotas · dependências · validação HTTP</text>
  <rect x="735" y="304" width="430" height="89" rx="6" class="node"/>
  <text x="758" y="340" class="node-title">Services</text>
  <text x="758" y="367" class="node-copy">autorização · conteúdo · compras · aprendizagem</text>
  <rect x="735" y="418" width="430" height="82" rx="6" class="node"/>
  <text x="758" y="453" class="node-title">Repositories + SQLAlchemy</text>
  <text x="758" y="479" class="node-copy">consultas · transações · constraints</text>
  <rect x="735" y="535" width="430" height="108" rx="6" class="node"/>
  <text x="758" y="570" class="node-title">Adaptadores de integração</text>
  <text x="758" y="597" class="node-copy">Firebase Admin · Cloudflare Stream</text>
  <text x="758" y="622" class="node-copy">Mercado Pago · tratamento de falhas</text>

  <rect x="1260" y="190" width="260" height="118" rx="6" class="node-red"/>
  <text x="1282" y="226" class="node-title">PostgreSQL</text>
  <text x="1282" y="253" class="node-copy">modelo relacional</text>
  <text x="1282" y="279" class="node-copy">dados de domínio e auditoria</text>
  <rect x="1260" y="430" width="260" height="82" rx="6" class="node"/>
  <text x="1282" y="464" class="node-title">Firebase Auth</text>
  <text x="1282" y="490" class="node-copy">identidade e tokens</text>
  <rect x="1260" y="535" width="260" height="82" rx="6" class="node"/>
  <text x="1282" y="569" class="node-title">Cloudflare Stream</text>
  <text x="1282" y="595" class="node-copy">upload direto e playback assinado</text>
  <rect x="1260" y="630" width="260" height="45" rx="6" class="node-dark"/>
  <text x="1282" y="659" class="node-title white">Mercado Pago</text>

  <rect x="40" y="735" width="745" height="235" rx="8" class="lane"/>
  <rect x="815" y="735" width="745" height="235" rx="8" class="lane"/>
  <text x="64" y="773" class="lane-title">DESENVOLVIMENTO VALIDADO</text>
  <text x="839" y="773" class="lane-title">TOPOLOGIA DE PRODUÇÃO</text>

  <rect x="70" y="805" width="300" height="112" rx="6" class="node"/>
  <text x="92" y="840" class="node-title">Docker Compose</text>
  <text x="92" y="867" class="node-copy">PostgreSQL · FastAPI · Next.js</text>
  <text x="92" y="892" class="node-copy">5433 · 8000 · 3000</text>
  <rect x="430" y="805" width="300" height="112" rx="6" class="node"/>
  <text x="452" y="840" class="node-title">Migrations explícitas</text>
  <text x="452" y="867" class="node-copy">Alembic upgrade head</text>
  <text x="452" y="892" class="node-copy">antes de validar as rotas</text>
  <path d="M370 861 H425" class="line"/>

  <rect x="845" y="805" width="205" height="112" rx="6" class="node-red"/>
  <text x="864" y="840" class="node-title">Cloud Run</text>
  <text x="864" y="867" class="node-copy">frontend + backend</text>
  <text x="864" y="892" class="node-copy">HTTPS gerenciado</text>
  <rect x="1080" y="805" width="205" height="112" rx="6" class="node"/>
  <text x="1099" y="840" class="node-title">Cloud SQL</text>
  <text x="1099" y="867" class="node-copy">PostgreSQL</text>
  <text x="1099" y="892" class="node-copy">socket privado</text>
  <rect x="1315" y="805" width="205" height="112" rx="6" class="node"/>
  <text x="1334" y="840" class="node-title">Secret Manager</text>
  <text x="1334" y="867" class="node-copy">credenciais runtime</text>
  <text x="1334" y="892" class="node-copy">WIF para GitHub Actions</text>
  <path d="M1050 861 H1075" class="line"/>
  <path d="M950 805 V790 H1417 V805" class="line"/>
  <text x="1155" y="785" class="label">segredos em runtime</text>
  <text x="845" y="947" class="small">Alvo documentado; deploy GCP não executado.</text>
</svg>
