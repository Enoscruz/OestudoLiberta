<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura da plataforma OestudoLiberta</title>
  <desc id="description">Diagrama de arquitetura com clientes, Next.js, FastAPI, PostgreSQL e integrações externas, além dos ambientes local e de produção previsto.</desc>
  <defs>
    <marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#830000"/>
    </marker>
    <marker id="identity" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#444444"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #000; }
      .subtitle { font: 16px Arial, sans-serif; fill: #555; }
      .lane-title { font: 700 14px Arial, sans-serif; letter-spacing: 1px; fill: #830000; }
      .node-title { font: 700 17px Arial, sans-serif; fill: #111; }
      .copy { font: 13px Arial, sans-serif; fill: #444; }
      .small { font: 12px Arial, sans-serif; fill: #555; }
      .lane { fill: #fff; stroke: #d3d3d3; stroke-width: 1.5; }
      .box { fill: #fafafa; stroke: #bdbdbd; stroke-width: 1.5; }
      .box-red { fill: #fff8f8; stroke: #bc0202; stroke-width: 2; }
      .box-dark { fill: #111; stroke: #111; stroke-width: 1.5; }
      .white { fill: #fff; }
      .request-line { fill: none; stroke: #830000; stroke-width: 2.4; marker-end: url(#request); }
      .identity-line { fill: none; stroke: #444; stroke-width: 2; marker-end: url(#identity); }
      .event-line { fill: none; stroke: #bc0202; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#request); }
      .label { font: 12px Arial, sans-serif; fill: #830000; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f5f5f5"/>
  <text x="48" y="58" class="title">OestudoLiberta | Arquitetura da plataforma</text>
  <text x="48" y="88" class="subtitle">Monólito modular · identidade delegada · regras de negócio centralizadas na API</text>

  <rect x="40" y="125" width="245" height="555" rx="7" class="lane"/>
  <rect x="305" y="125" width="345" height="555" rx="7" class="lane"/>
  <rect x="670" y="125" width="500" height="555" rx="7" class="lane"/>
  <rect x="1190" y="125" width="370" height="555" rx="7" class="lane"/>
  <text x="60" y="158" class="lane-title">CLIENTE</text>
  <text x="325" y="158" class="lane-title">FRONTEND</text>
  <text x="690" y="158" class="lane-title">BACKEND</text>
  <text x="1210" y="158" class="lane-title">DADOS E PROVEDORES</text>

  <path d="M160 285 V345" class="identity-line"/>
  <path d="M265 405 H325 V250 H350" class="request-line"/>
  <path d="M500 310 V385" class="identity-line"/>
  <path d="M625 245 H710" class="request-line"/>
  <path d="M940 274 V305" class="request-line"/>
  <path d="M940 390 V420" class="request-line"/>
  <path d="M1150 460 H1175 V240 H1225" class="request-line"/>
  <path d="M1150 560 H1175 V450 H1225" class="request-line"/>
  <path d="M1150 585 H1225" class="request-line"/>
  <path d="M1150 615 H1175 V610 H1225" class="request-line"/>
  <path d="M625 445 H660 V700 H1540 V450 H1515" class="identity-line"/>
  <path d="M1515 630 H1540 V715 H680 V235 H710" class="event-line"/>

  <text x="276" y="390" class="label">HTTPS</text>
  <text x="654" y="232" class="label">Bearer ID Token</text>
  <text x="1180" y="230" class="label">SQL</text>
  <text x="1177" y="440" class="label">Firebase Admin</text>
  <text x="1177" y="578" class="label">Cloudflare API</text>
  <text x="1166" y="604" class="label">Checkout</text>
  <text x="805" y="708" class="label">webhook payment.updated</text>
  <text x="810" y="694" class="label">Firebase Web SDK</text>

  <rect x="65" y="190" width="190" height="95" rx="5" class="box-dark"/>
  <text x="88" y="229" class="node-title white">Aluno / Admin</text>
  <text x="88" y="257" class="copy white">desktop · tablet · mobile</text>
  <rect x="65" y="345" width="190" height="115" rx="5" class="box"/>
  <text x="88" y="382" class="node-title">Navegador</text>
  <text x="88" y="410" class="copy">UI e chamadas HTTP</text>
  <text x="88" y="435" class="copy">cliente não é autoridade</text>

  <rect x="350" y="190" width="275" height="120" rx="5" class="box-red"/>
  <text x="372" y="229" class="node-title">Next.js 16 · React 19</text>
  <text x="372" y="257" class="copy">catálogo · checkout · player</text>
  <text x="372" y="283" class="copy">dashboard · administração</text>
  <rect x="350" y="385" width="275" height="115" rx="5" class="box"/>
  <text x="372" y="423" class="node-title">Firebase Web SDK</text>
  <text x="372" y="451" class="copy">cadastro · login · ID Token</text>
  <text x="372" y="477" class="copy">senha nunca passa pela API</text>

  <rect x="710" y="190" width="440" height="84" rx="5" class="box-red"/>
  <text x="733" y="224" class="node-title">FastAPI · REST /api/v1</text>
  <text x="733" y="251" class="copy">rotas · dependências · validação HTTP</text>
  <rect x="710" y="305" width="440" height="85" rx="5" class="box"/>
  <text x="733" y="340" class="node-title">Services</text>
  <text x="733" y="367" class="copy">políticas · conteúdo · compras · aprendizagem</text>
  <rect x="710" y="420" width="440" height="80" rx="5" class="box"/>
  <text x="733" y="455" class="node-title">Repositories + SQLAlchemy</text>
  <text x="733" y="481" class="copy">consultas · transações · constraints</text>
  <rect x="710" y="530" width="440" height="120" rx="5" class="box"/>
  <text x="733" y="566" class="node-title">Adaptadores de integração</text>
  <text x="733" y="594" class="copy">Firebase Admin · Cloudflare Stream</text>
  <text x="733" y="621" class="copy">Mercado Pago · idempotência · erros</text>

  <rect x="1225" y="190" width="300" height="100" rx="5" class="box-red"/>
  <text x="1248" y="228" class="node-title">PostgreSQL</text>
  <text x="1248" y="256" class="copy">dados relacionais · auditoria</text>
  <rect x="1225" y="400" width="290" height="100" rx="5" class="box"/>
  <text x="1248" y="438" class="node-title">Firebase Authentication</text>
  <text x="1248" y="466" class="copy">identidade e verificação de e-mail</text>
  <rect x="1225" y="530" width="290" height="80" rx="5" class="box"/>
  <text x="1248" y="565" class="node-title">Cloudflare Stream</text>
  <text x="1248" y="590" class="copy">upload direto · playback assinado</text>
  <rect x="1225" y="620" width="290" height="48" rx="5" class="box-dark"/>
  <text x="1248" y="650" class="node-title white">Mercado Pago</text>

  <rect x="40" y="735" width="745" height="235" rx="7" class="lane"/>
  <rect x="815" y="735" width="745" height="235" rx="7" class="lane"/>
  <text x="62" y="773" class="lane-title">AMBIENTE LOCAL VALIDADO</text>
  <text x="838" y="773" class="lane-title">AMBIENTE GCP PREVISTO</text>

  <rect x="70" y="805" width="300" height="112" rx="5" class="box"/>
  <text x="92" y="841" class="node-title">Docker Compose</text>
  <text x="92" y="869" class="copy">PostgreSQL · FastAPI · Next.js</text>
  <text x="92" y="894" class="copy">portas 5433 · 8000 · 3000</text>
  <rect x="430" y="805" width="300" height="112" rx="5" class="box"/>
  <text x="452" y="841" class="node-title">Migrações explícitas</text>
  <text x="452" y="869" class="copy">Alembic upgrade head</text>
  <text x="452" y="894" class="copy">antes do uso funcional</text>
  <path d="M370 861 H425" class="request-line"/>

  <rect x="845" y="805" width="205" height="112" rx="5" class="box-red"/>
  <text x="866" y="841" class="node-title">Cloud Run</text>
  <text x="866" y="869" class="copy">frontend + backend</text>
  <text x="866" y="894" class="copy">HTTPS gerenciado</text>
  <rect x="1080" y="805" width="205" height="112" rx="5" class="box"/>
  <text x="1101" y="841" class="node-title">Cloud SQL</text>
  <text x="1101" y="869" class="copy">PostgreSQL</text>
  <text x="1101" y="894" class="copy">socket Cloud SQL</text>
  <rect x="1315" y="805" width="205" height="112" rx="5" class="box"/>
  <text x="1336" y="841" class="node-title">Secret Manager</text>
  <text x="1336" y="869" class="copy">segredos runtime</text>
  <text x="1336" y="894" class="copy">WIF para GitHub Actions</text>
  <path d="M1050 861 H1075" class="request-line"/>
  <path d="M950 805 V790 H1417 V805" class="request-line"/>
  <text x="1140" y="786" class="label">segredos em runtime</text>
  <text x="845" y="947" class="small">Alvo documentado; deploy GCP não executado.</text>
</svg>
